# Hand-written scopes for countries whose Natural Earth shape includes distant territories (D-007, D-018).
# src/select_countries.py uses these specs in place of the default scope.
# Fields are the same as in countries.yaml.

countries:
  - name: United States
    ne_name: United States of America
    scope: the contiguous United States (the lower 48 states only, no Alaska or Hawaii)
    bbox: [-125, 24, -66, 50]

  - name: France
    scope: metropolitan France including Corsica (no overseas territories)
    bbox: [-5.5, 41, 10, 51.5]

  - name: Norway
    scope: mainland Norway (no Svalbard or Jan Mayen)
    bbox: [4, 57, 32, 72]
